{% extends "base.html" %}
{% block title %}Admin inloggen – KNLTB Tourpoule 2026{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="text-5xl mb-3">⚙️</div>
      <h1 class="text-2xl font-extrabold text-gray-900">Admin inloggen</h1>
      <p class="text-gray-400 text-sm mt-1">KNLTB Tourpoule 2026</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-zinc-900">
        <span class="font-semibold text-tdf-yellow">Toegang beheerders</span>
      </div>
      <form method="post" class="p-6 space-y-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">
            Wachtwoord
          </label>
          <input type="password" name="password" id="inp-password" autofocus required
                 placeholder="Beheerderswachtwoord"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-tdf-yellow">
        </div>
        <button type="submit"
                class="w-full bg-tdf-yellow text-zinc-900 font-bold px-4 py-3 rounded-xl
                       hover:bg-yellow-300 transition-colors">
          Inloggen →
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-4">
      <a href="{{ url_for('index') }}" class="hover:text-gray-600">← Terug naar de website</a>
    </p>
  </div>
</div>
{% endblock %}
